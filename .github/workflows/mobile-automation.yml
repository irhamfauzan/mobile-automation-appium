name: Mobile Automation Tests

on:
  push:
    branches: [main, develop, "claude/**"]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:
    inputs:
      platform:
        description: 'Target platform'
        required: true
        default: 'android'
        type: choice
        options: [android, ios]
      test_group:
        description: 'Test group to run'
        required: true
        default: 'smoke'
        type: choice
        options: [smoke, regression, data-driven]

env:
  JAVA_VERSION: '21'
  NODE_VERSION: '18'

jobs:
  # ─── Build & validate ────────────────────────────────────────────────────
  build:
    name: Build & Compile
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: maven

      - name: Compile sources
        run: mvn compile test-compile --no-transfer-progress

      - name: Upload compiled classes
        uses: actions/upload-artifact@v4
        with:
          name: compiled-classes
          path: target/
          retention-days: 1

  # ─── Smoke tests (Android emulator) ──────────────────────────────────────
  smoke-android:
    name: Smoke Tests (Android)
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name != 'workflow_dispatch' || inputs.test_group == 'smoke'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: maven

      - name: Set up Node.js (for Appium)
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install Appium & drivers
        run: |
          npm install -g appium@latest
          appium driver install uiautomator2
          appium driver list

      - name: Enable KVM (Android emulator acceleration)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Start Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 31
          target: google_apis
          arch: x86_64
          profile: pixel_4
          avd-name: test_avd
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          disable-animations: true
          script: |
            echo "Emulator started"
            adb devices
            adb wait-for-device

      - name: Start Appium server
        run: |
          appium --address 127.0.0.1 --port 4723 --log appium.log &
          sleep 5
          curl -s http://127.0.0.1:4723/status | python3 -m json.tool

      - name: Run smoke tests
        env:
          PLATFORM: android
          APPIUM_URL: http://127.0.0.1:4723
          ANDROID_DEVICE_NAME: test_avd
          ANDROID_PLATFORM_VERSION: "12.0"
        run: |
          mvn test -Psmoke --no-transfer-progress \
            -Dplatform=android \
            -Dappium.url=http://127.0.0.1:4723

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-test-reports
          path: |
            test-output/extent-reports/
            test-output/screenshots/
            test-output/logs/
            appium.log

  # ─── Regression tests ────────────────────────────────────────────────────
  regression-android:
    name: Regression Tests (Android)
    runs-on: ubuntu-latest
    needs: smoke-android
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: maven

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install Appium
        run: |
          npm install -g appium@latest
          appium driver install uiautomator2

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run regression tests with emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 31
          target: google_apis
          arch: x86_64
          profile: pixel_4
          avd-name: test_avd
          disable-animations: true
          script: |
            appium --address 127.0.0.1 --port 4723 --log appium.log &
            sleep 5
            mvn test -Pregression --no-transfer-progress \
              -Dplatform=android \
              -Dappium.url=http://127.0.0.1:4723

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: regression-test-reports
          path: |
            test-output/extent-reports/
            test-output/screenshots/
            test-output/logs/

  # ─── Publish report summary ──────────────────────────────────────────────
  report-summary:
    name: Test Summary
    runs-on: ubuntu-latest
    needs: [smoke-android]
    if: always()

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: "*-test-reports"
          merge-multiple: true
          path: all-reports/

      - name: List reports
        run: find all-reports/ -type f | sort

      - name: Publish HTML report
        uses: actions/upload-artifact@v4
        with:
          name: full-test-report
          path: all-reports/
          retention-days: 30
