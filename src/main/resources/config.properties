# ════════════════════════════════════════════
#  Mobile Automation Framework - Configuration
# ════════════════════════════════════════════

# Platform: android | ios
platform=android

# Appium server URL
appium.url=http://127.0.0.1:4723

# ─── Android ────────────────────────────────
android.device.name=Android Emulator
android.platform.version=12.0
android.automation.name=UiAutomator2

# App by path (comment out if using package/activity)
# android.app.path=/path/to/your/app.apk

# App by package/activity (comment out if using app path)
android.app.package=com.example.app
android.app.activity=com.example.app.MainActivity

# ─── iOS ────────────────────────────────────
ios.device.name=iPhone 14 Simulator
ios.platform.version=16.4
ios.automation.name=XCUITest
ios.udid=

# App by path (comment out if using bundle ID)
# ios.app.path=/path/to/your/app.app

# App by bundle ID
# ios.bundle.id=com.example.app

# ─── Driver Behaviour ───────────────────────
implicit.wait=10
explicit.wait=15
no.reset=false
full.reset=false

# ─── Test Credentials ───────────────────────
# Override via .env or environment variables in CI
valid.username=testuser@example.com
valid.password=Test@1234

# ─── Reporting ──────────────────────────────
screenshot.on.failure=true
screenshot.on.pass=false
